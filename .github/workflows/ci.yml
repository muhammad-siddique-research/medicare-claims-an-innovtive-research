name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - name: Run deterministic toy demonstration
        run: |
          python -m medicare_claims.cli make-fixture --dest data/toy
          python -m medicare_claims.cli run --data-dir data/toy --year 2022 --output-dir reports/toy
      - name: Run known-truth claim granularity experiment
        run: |
          python -m medicare_claims.stress_test --n-beneficiaries 90 --replications 2 --seed 21 --output-dir reports/stress_test
          python -c "import json; from pathlib import Path; m=json.loads(Path('reports/stress_test/simulation_metadata.json').read_text()); assert m['cms_data_used'] is False"

      - name: Preserve toy reproducibility reports
        uses: actions/upload-artifact@v4
        with:
          name: invented-data-research-figures-py${{ matrix.python-version }}
          path: |
            reports/toy/
            reports/stress_test/
          if-no-files-found: error
          retention-days: 14
