<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="tt ds">
<title id="tt">Theoretical count inflation across beneficiary ages under two claim-line multiplicity scenarios</title>
<desc id="ds">Expected unique claims are given by 1.4 exp of 0.18 times age in decades above 65. Uniform line duplication yields a parallel inflated curve; age-dependent duplication yields an increasingly inflated curve. A schematic of a hypothetical data generating process, not observed CMS data.</desc>
<rect x="0" y="0" width="980" height="430" rx="16" fill="#f8fafc"/>
<text x="38" y="39" font-size="24" font-weight="700" font-family="Arial,sans-serif" fill="#0f172a">Why claim-line counting can bias age associations</text>
<text x="38" y="64" font-size="13" font-family="Arial,sans-serif" fill="#475569">Analytic expectations from the stated Monte Carlo data-generating process — NOT CMS measurements</text>
<rect x="94" y="88" width="794" height="274" rx="9" fill="#ffffff"/>
