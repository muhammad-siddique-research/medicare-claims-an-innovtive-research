<rect x="40" y="520" width="1120" height="57" rx="9" fill="#e2e8f0"/>
<text x="600" y="544" font-size="16" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-weight="700" fill="#0f172a">EVIDENCE STATUS: Development &amp; synthetic simulation; not population inference</text>
<text x="600" y="563" font-size="13" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#475569">The official CMS data product is real, but the project's published numerical demonstration uses artificial records.</text>
</svg>